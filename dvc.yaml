stages:
  prepare:
    cmd: python src/prepare.py data/raw/House_Rent_10M_balanced_40cities.csv data/prepared
    deps:
      - data/raw/House_Rent_10M_balanced_40cities.csv
      - src/prepare.py
      - src/preprocess.py
    params:
      - prepare
    outs:
      - data/prepared

  train:
    cmd: python src/train.py data/prepared data/models
    deps:
      - data/prepared
      - src/train.py
      - src/repro_metadata.py
    params:
      - train
    outs:
      - data/models

  evaluate:
    cmd: python src/evaluate.py data/models/model.pkl data/prepared
    deps:
      - data/models/model.pkl
      - data/prepared/test.csv
      - src/evaluate.py
      - src/repro_metadata.py
      - params.yaml
    params:
      - evaluate
    outs:
      - metrics.json
      - artifacts/confusion_matrix.png

  optimize:
    cmd: python src/optimize.py
    deps:
      - data/prepared/train.csv
      - data/prepared/test.csv
      - src/optimize.py
      - config/config.yaml
      - config/model/random_forest.yaml
      - config/hpo/optuna.yaml
      - config/hpo/random.yaml
      - config/hpo/grid.yaml
    outs:
      - models/best_model.pkl
